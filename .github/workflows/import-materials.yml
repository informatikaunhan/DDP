name: Import DDP learning materials
on:
  push:
    paths:
      - 'import-data/DDP101_Belajar_Mandiri.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and publish learning materials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path('import-data/DDP101_Belajar_Mandiri.zip')
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise ValueError('Unsafe archive path')
                  if not item.is_dir():
                      dest = Path('.') / path
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(z.read(item))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md LICENSE_NOTICE.md pertemuan-* assets/ .gitignore
          git diff --cached --quiet || git commit -m 'Publish DDP101 self-study materials'
          git push
